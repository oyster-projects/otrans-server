services:
  otrans:
    build:
      context: .
    image: otrans-server:0.5.3
    container_name: otrans-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      OTRANS_ADMIN_TOKEN: "${OTRANS_ADMIN_TOKEN:?请在 .env 中设置管理员令牌}"
      OTRANS_MAX_UPLOAD_BYTES: "${OTRANS_MAX_UPLOAD_BYTES:-4294967296}"
      OTRANS_MAX_STORAGE_BYTES: "${OTRANS_MAX_STORAGE_BYTES:-107374182400}"
      OTRANS_RETENTION_DAYS: "${OTRANS_RETENTION_DAYS:-30}"
    volumes:
      - otrans-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

volumes:
  otrans-data:
